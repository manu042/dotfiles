# ── Prefix & Window/Pane Creation ───────────
# Start Window numbering at 1
set -g base-index 1

# Use Ctrl+Space instead of Ctrl+B
unbind C-b
set -g prefix C-Space
# Press the prefix twice to send Ctrl+Space to the application.
bind C-Space send-prefix

# Create windows and split panes in the active pane's working directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ── Selection Bindings ──────────────────────
# Copy on mouse release; keep the selection visible and remain in copy mode.
# Apply mouse behavior to both the default and vi copy-mode key tables.
bind -T copy-mode MouseDragEnd1Pane \
    send-keys -X copy-pipe-no-clear

bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-pipe-no-clear

# Single click clears selection and exits copy mode
bind -T copy-mode MouseDown1Pane send-keys -X cancel
bind -T copy-mode-vi MouseDown1Pane send-keys -X cancel

# ── Session & Pane Defaults ─────────────────
# Retain up to 20,000 lines of scrollback per pane.
set -g history-limit 20000

# Enable mouse selection, scrolling and resizing
set -g mouse on

# ── Clipboard ───────────────────────────────
# Use pbcopy for the macOS clipboard instead of terminal clipboard escapes.
set -s set-clipboard off
set -s copy-command 'pbcopy'
# Linux (Wayland, requires wl-clipboard):
# set -s copy-command 'wl-copy'
# Linux (X11, requires xclip):
# set -s copy-command 'xclip -selection clipboard'

# ── Window Names ────────────────────────────
# At the shell: directory. In an app: directory/app.
# Keep names within 20 characters, abbreviating the directory first.
# Very long app names are capped at 17 to leave room for the directory.
# Expand these helper formats with E: when composing the window name.
set -g @window-app '#{?#{>:#{n:pane_current_command},17},#{=/16/…:pane_current_command},#{pane_current_command}}'
set -g @window-dir-limit '#{e|-:19,#{n:#{E:@window-app}}}'
set -g @window-dir '#{?#{>:#{n:#{b:pane_current_path}},#{E:@window-dir-limit}},#{=/#{e|-:#{E:@window-dir-limit},1}/…:#{b:pane_current_path}},#{b:pane_current_path}}'
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(bash|zsh|sh|fish|dash|ksh|tcsh|csh|nu|login)$,#{pane_current_command}},#{?#{>:#{n:#{b:pane_current_path}},20},#{=/19/…:#{b:pane_current_path}},#{b:pane_current_path}},#{E:@window-dir}/#{E:@window-app}}'

# ── Status Bar Layout ───────────────────────
# Show the bar below the panes and refresh its contents every five seconds.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Reserve space for the session label and the longer Git/path/time segment.
set -g status-left-length 40
set -g status-right-length 160
# Window formats provide their own spacing and color transitions.
set -g window-status-separator ''

# ── Tokyo Night: Copy Mode & Status Bar ─────
# Blue selection highlight and a right-aligned scrollback position indicator.
set -g copy-mode-selection-style 'bg=#414f80,fg=#ffffff'
set -g copy-mode-position-style 'bg=#34394d,fg=#7aa2f7'
set -g copy-mode-position-format '#[align=right] #{scroll_position} / #{history_size} '

set -g status-style 'bg=#1a1b26,fg=#c0caf5'

# ── Left: Prefix + Session ──────────────────
# Highlight PREFIX while tmux is waiting for the next key; #S is the session name.
set -g status-left '#{?client_prefix,#[fg=#1a1b26#,bg=#f7768e#,bold] PREFIX #[fg=#f7768e#,bg=#7aa2f7],}#[fg=#1a1b26,bg=#7aa2f7,bold] #S '

# ── Windows ────────────────────────────────
# One continuous block, no | separators.
# First arrow adapts to the first window.
# Show each window number and name; cap names at 20 characters with an ellipsis.
# The number and colon do not count toward the name limit. #I is the window index.

set -g window-status-format '#{?window_start_flag,#[fg=#7aa2f7#,bg=#34394d],}#[fg=#c0caf5,bg=#34394d,nobold]  #I:#{?#{>:#{n:window_name},20},#{=/19/…:window_name},#{window_name}}  '

set -g window-status-current-format '#{?window_start_flag,#[fg=#7aa2f7#,bg=#9ece6a],}#[fg=#1a1b26,bg=#9ece6a,bold]  #I:#{?#{>:#{n:window_name},20},#{=/19/…:window_name},#{window_name}}  '

# ── Right: Git + Path + Time + Date ─────────
# Branch only, with * when the working tree has changes.
# Long paths abbreviate parent directories; the final directory stays intact.
# Pass the active pane ID to the script so it can look up that pane's directory.
set -g status-right '#(/bin/bash ~/.config/tmux/status.sh #{pane_id})#[fg=#7aa2f7,bg=#414868]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M #[fg=#9ece6a,bg=#7aa2f7]#[fg=#1a1b26,bg=#9ece6a,bold] %d.%m.%y '

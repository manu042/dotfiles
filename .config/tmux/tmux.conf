# ── Prefix Key ──────────────────────────
# Use Ctrl+Space instead of Ctrl+B
unbind C-b
set -g prefix C-Space
# Press the prefix twice to send Ctrl+Space to the application.
bind C-Space send-prefix


# ── General Settings ─────────────────────
# Retain up to x lines of scrollback per pane.
set -g history-limit 20000

# Enable mouse selection, scrolling and resizing
set -g mouse on

# Start Window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Create windows and split panes in the active pane's working directory.
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
# Left/right panes and top/bottom panes, respectively.
bind b split-window -h -c "#{pane_current_path}"
bind B split-window -v -c "#{pane_current_path}"


# ── Copy Mode ──────────────────────
# Vi Keys in Copy Mode
set-window-option -g mode-keys vi

# Copy on mouse release; keep the selection visible and remain in copy mode.
# Apply mouse behavior to both the default and vi copy-mode key tables.
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# Focus the clicked pane and clear its highlight without leaving scrollback.
bind -T copy-mode MouseDown1Pane select-pane -t= \; send-keys -X -M clear-selection
bind -T copy-mode-vi MouseDown1Pane select-pane -t= \; send-keys -X -M clear-selection
bind -T copy-mode q send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Blue selection highlight, copy-mode label and scrollback position indicator.
set -g copy-mode-selection-style 'bg=#414f80,fg=#ffffff'
set -g copy-mode-position-style 'bg=#34394d,fg=#7aa2f7'
set -g copy-mode-position-format '#[align=right] #{scroll_position} / #{history_size} | COPY MODE (Quit: q)'


# ── Clipboard ───────────────────────────────
# Use pbcopy for the macOS clipboard instead of terminal clipboard escapes.
set -s set-clipboard off
set -s copy-command 'pbcopy'
# Linux (Wayland, requires wl-clipboard):
# set -s copy-command 'wl-copy'
# Linux (X11, requires xclip):
# set -s copy-command 'xclip -selection clipboard'


# ── Window Names ────────────────────────────
# At the shell: directory. In an app: directory/app.
# Show ~ when the active pane is in the home directory.
# Keep names within 20 characters, abbreviating the directory first.
# Very long app names are capped at 17 to leave room for the directory.
# Expand these helper formats with E: when composing the window name.
set -g @window-app '#{?#{>:#{n:pane_current_command},17},#{=/16/…:pane_current_command},#{pane_current_command}}'
set -g @window-dir-limit '#{e|-:19,#{n:#{E:@window-app}}}'
set -g @window-dir-name '#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set -g @window-dir '#{?#{>:#{n:#{E:@window-dir-name}},#{E:@window-dir-limit}},#{=/#{e|-:#{E:@window-dir-limit},1}/…:#{E:@window-dir-name}},#{E:@window-dir-name}}'
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(bash|zsh|sh|fish|dash|ksh|tcsh|csh|nu|login)$,#{pane_current_command}},#{?#{>:#{n:#{E:@window-dir-name}},20},#{=/19/…:#{E:@window-dir-name}},#{E:@window-dir-name}},#{E:@window-dir}/#{E:@window-app}}'


# ── Status Bar Layout ───────────────────────
# Show the bar below the panes and refresh its contents every five seconds.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Upper bounds; the right segment also shrinks to leave room for window labels.
set -g status-left-length 40
set -g status-right-length 160
set -g status-style 'bg=#1a1b26,fg=#c0caf5'
set -g window-status-separator ''

# Left Status: Prefix + Session
# Highlight PREFIX while tmux is waiting for the next key; #S is the session name.
set -g status-left '#{?client_prefix,#[fg=#1a1b26#,bg=#f7768e#,bold] PREFIX #[fg=#f7768e#,bg=#7aa2f7],}#[fg=#1a1b26,bg=#7aa2f7,bold] #S '

# Windows
# One continuous block, no | separators.
# First arrow adapts to the first window.
# Show each window number and name; cap names at 20 characters with an ellipsis.
# The number and colon do not count toward the name limit. #I is the window index.
set -g window-status-format '#{?window_start_flag,#[fg=#7aa2f7#,bg=#34394d],}#[fg=#c0caf5,bg=#34394d,nobold]  #I:#{?#{>:#{n:window_name},20},#{=/19/…:window_name},#{window_name}}  '
set -g window-status-current-format '#{?window_start_flag,#[fg=#7aa2f7#,bg=#9ece6a],}#[fg=#1a1b26,bg=#9ece6a,bold]  #I:#{?#{>:#{n:window_name},20},#{=/19/…:window_name},#{window_name}}  '

# Right Status: Git + Path + Time + Date
# Current branch only; no working-tree scan.
# Long paths abbreviate parent directories before clipping to the available width.
# Pass the active pane ID to the script so it can look up that pane's directory.
set -g @status-right-full '#(/bin/bash ~/.config/tmux/status.sh #{pane_id})#[fg=#7aa2f7,bg=#414868]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M #[fg=#9ece6a,bg=#7aa2f7]#[fg=#1a1b26,bg=#9ece6a,bold] %d.%m.%y '
set -g @status-time-only '#[fg=#7aa2f7,bg=#1a1b26]#[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M '
# Measure the visible left label (including PREFIX), then reserve 30 columns for the window list.
# Recompute per client so resizing and shared sessions work.
set -g @status-right-space '#{e|-:#{client_width},#{e|+:#{w:#{=/#{status-left-length}:#{E:status-left}}},30}}'
set -g @status-right-width '#{?#{e|<:#{E:@status-right-space},#{status-right-length}},#{E:@status-right-space},#{status-right-length}}'
# Trim from the left to keep the clock/date and the end of the path visible.
# Below 20 available columns use only the clock; below 8 omit the right segment.
set -g status-right '#{?#{e|>=:#{E:@status-right-width},20},#{=/-#{e|-:#{E:@status-right-width},1}/…:#{T:@status-right-full}},#{?#{e|>=:#{E:@status-right-width},8},#{T:@status-time-only},}}'
